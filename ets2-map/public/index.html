<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="ETS2 与 ATS 全地图 DLC 离线瓦片地图，支持多语言城市搜索、区域导航与游戏切换。">
  <meta property="og:title" content="ETS2 / ATS 全 DLC 地图">
  <meta property="og:description" content="在一个地图中浏览欧洲与美国的全部 DLC 区域。">
  <meta property="og:image" content="./vendor/icons/ets2.png">
  <title>ETS2 / ATS 全 DLC 地图</title>
  <link rel="icon" href="./vendor/icons/ets2.png" type="image/png">
  <link rel="preload" href="./vendor/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./app.css?v=9">
</head>
<body>
  <a class="skip-link" href="#sidebar">跳到地图控制</a>
  <main id="app">
    <div id="map" aria-label="欧洲卡车模拟2互动地图"></div>
    <button id="panel-toggle" class="icon-button panel-toggle" type="button" aria-label="打开地图面板" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <aside id="sidebar" class="sidebar" aria-label="地图控制面板" tabindex="-1">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">TS</div>
        <div class="brand-copy">
          <p class="eyebrow">EURO TRUCK SIMULATOR 2</p>
          <h1>欧洲全图</h1>
        </div>
        <button id="panel-close" class="icon-button panel-close" type="button" aria-label="关闭地图面板">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <section class="status-card" aria-label="地图数据概况">
        <div><strong id="city-count">—</strong><span>城市</span></div>
        <div><strong id="dlc-count">12</strong><span>地图 DLC</span></div>
        <div><strong>9</strong><span>缩放层级</span></div>
      </section>

      <div class="sidebar-controls">
        <section class="basemap-section">
          <div class="section-title"><label for="basemap">底图数据</label><small>选择地图版本</small></div>
          <div class="select-wrap">
            <select id="basemap" aria-label="底图数据分类" disabled>
              <option value="Europe">ETS2 · 原版</option>
              <option value="TMP">ETS2 · TMP S1</option>
              <option value="Europe_Promods">ETS2 · ProMods</option>
              <option value="TMP_Promods">ETS2 · TMP ProMods</option>
            </select>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </div>
        </section>

        <section class="search-section">
          <label class="control-label" for="search">城市搜索</label>
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="search" type="search" placeholder="输入任意语言的城市名" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
          </div>
          <div class="search-options">
            <label for="locale">城市语言</label>
            <div class="select-wrap compact">
              <select id="locale" aria-label="城市名称语言">
                <option value="zh_cn">简体中文</option>
                <option value="en_gb">English</option>
                <option value="native">地图原文</option>
              </select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </div>
          </div>
          <div class="layer-options" aria-label="地图图层">
            <label class="toggle"><span>显示城市范围</span><input id="show-cities" type="checkbox"></label>
            <label class="toggle"><span>DLC 区域边界</span><input id="show-dlc-boundaries" type="checkbox"></label>

          </div>
          <div id="search-results" class="search-results" role="listbox" aria-label="城市搜索结果"></div>
        </section>
      </div>

      <section class="regions">
        <div class="section-title"><span>区域导航</span><small>全部地图 DLC</small></div>
        <div id="region-list" class="region-list"></div>
      </section>
      <footer class="sidebar-footer">
        <button id="reset-view" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 15a7 7 0 1 0 1-8M4 10l5 1"/></svg>
          重置全图
        </button>
        <span>离线瓦片 · 无需外部服务</span>
      </footer>
    </aside>

    <section class="game-dock" aria-label="游戏选择">
      <span id="game-label" class="game-label">选择游戏</span>
      <div id="game" class="game-switch" role="group" aria-labelledby="game-label" data-value="ETS2">
        <button class="game-option active" type="button" data-game="ETS2" aria-pressed="true">
          <img src="./vendor/icons/ets2.png" alt="" width="512" height="256">
          <span><strong>ETS2</strong><small>欧洲</small></span>
        </button>
        <button class="game-option" type="button" data-game="ATS" aria-pressed="false">
          <img src="./vendor/icons/ats.png" alt="" width="512" height="256">
          <span><strong>ATS</strong><small>美国</small></span>
        </button>
      </div>
    </section>
    <div id="map-badge" class="map-badge"><span class="pulse"></span><span>全部地图 DLC</span></div>

    <div id="loading" class="loading" role="status">
      <div class="loading-card">
        <div class="loading-map" aria-hidden="true"><span></span><span></span><span></span></div>
        <strong>正在载入欧洲全图</strong>
        <span>读取瓦片与城市数据</span>
      </div>
    </div>
    <div id="error" class="error" hidden role="alert">
      <div class="error-card"><strong>地图数据载入失败</strong><p id="error-message"></p><button type="button" onclick="location.reload()">重新载入</button></div>
    </div>
    <div id="backdrop" class="backdrop"></div>
  </main>
  <script src="./vendor/leaflet.js"></script>
  <script src="./map-config.js"></script>
  <script src="./app.js?v=20"></script>
</body>
</html>
