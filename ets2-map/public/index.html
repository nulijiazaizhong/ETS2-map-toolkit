<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="ETS2 与 ATS 全地图 DLC 离线瓦片地图，支持城市搜索与区域导航。">
  <title>ETS2 / ATS 全 DLC 地图</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./app.css?v=6">
</head>
<body>
  <main id="app">
    <div id="map" aria-label="欧洲卡车模拟2互动地图"></div>
    <button id="panel-toggle" class="icon-button panel-toggle" type="button" aria-label="打开地图面板" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <aside id="sidebar" class="sidebar" aria-label="地图控制面板">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M5 23V9l11-5 11 5v14l-11 5L5 23Z"/><path d="m5 9 11 5 11-5M16 14v14"/></svg>
        </div>
        <div><p class="eyebrow">EURO TRUCK SIMULATOR 2</p><h1>欧洲全图</h1></div>
        <button id="panel-close" class="icon-button panel-close" type="button" aria-label="关闭地图面板">×</button>
      </header>
      <section class="status-card" aria-label="地图数据概况">
        <div><strong id="city-count">—</strong><span>城市</span></div>
        <div><strong id="dlc-count">12</strong><span>地图 DLC</span></div>
        <div><strong>9</strong><span>缩放层级</span></div>
      </section>
      <section class="basemap-section">
        <label id="game-label">游戏</label>
        <div id="game" class="game-switch" role="group" aria-labelledby="game-label" data-value="ETS2">
          <button class="game-option active" type="button" data-game="ETS2" aria-pressed="true">
            <img src="./vendor/icons/ets2.png" alt="Euro Truck Simulator 2">
            <span>ETS2</span>
          </button>
          <button class="game-option" type="button" data-game="ATS" aria-pressed="false">
            <img src="./vendor/icons/ats.png" alt="American Truck Simulator">
            <span>ATS</span>
          </button>
        </div>
      </section>
      <section class="basemap-section">
        <label for="basemap">底图数据</label>
        <select id="basemap" aria-label="底图数据分类" disabled>
          <option value="Europe">ETS2-原版</option>
          <option value="TMP">ETS2-TMP-S1</option>
          <option value="Europe_Promods">ETS2-Promods</option>
          <option value="TMP_Promods">ETS2-TMP-Promods</option>
        </select>
      </section>
      <section class="search-section">
        <label for="search">城市搜索</label>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="输入任意语言的城市名" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="search-options">
          <select id="locale" aria-label="城市名称语言">
            <option value="zh_cn">简体中文</option>
            <option value="en_gb">English</option>
            <option value="native">地图原文</option>
          </select>
          <label class="toggle"><input id="show-cities" type="checkbox"><span>显示城市</span></label>
        </div>
        <div class="boundary-toggle">
          <label class="toggle"><input id="show-dlc-boundaries" type="checkbox"><span>DLC 区域边界</span></label>
          <label class="toggle"><input id="show-game-background" type="checkbox" checked><span>游戏底图</span></label>
        </div>
        <div id="search-results" class="search-results" role="listbox" aria-label="城市搜索结果"></div>
      </section>
      <section class="regions">
        <div class="section-title"><span>区域导航</span><small>全部地图 DLC</small></div>
        <div id="region-list" class="region-list"></div>
      </section>
      <footer class="sidebar-footer">
        <button id="reset-view" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M5.5 15a7 7 0 0 0 12 2M18.5 9a7 7 0 0 0-12-2"/></svg>
          重置全图
        </button>
        <span>离线瓦片 · 无需外部服务</span>
      </footer>
    </aside>
    <div id="map-badge" class="map-badge"><span class="pulse"></span><span>ALL MAP DLC</span></div>
    <div id="loading" class="loading" role="status"><div class="spinner"></div><strong>正在载入欧洲全图</strong><span>读取瓦片与城市数据…</span></div>
    <div id="error" class="error" hidden role="alert"><strong>地图数据载入失败</strong><p id="error-message"></p><button type="button" onclick="location.reload()">重新载入</button></div>
    <div id="backdrop" class="backdrop"></div>
  </main>
  <script src="./vendor/leaflet.js"></script>
  <script src="./map-config.js"></script>
  <script src="./app.js?v=16"></script>
</body>
</html>
